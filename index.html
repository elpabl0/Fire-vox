<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Fire-Vox</title>
  <style>
    :root {
      --hud-bg: rgba(12, 16, 24, 0.82);
      --hud-border: rgba(255, 255, 255, 0.12);
      --accent: #ff8c3a;
      --accent2: #4db8ff;
      --text: #e8edf4;
      --muted: #9aa7b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0a0d12;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }
    button { touch-action: manipulation; font-family: inherit; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }

    .panel {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 8px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
    }

    #top-bar {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 18px; align-items: center;
      font-size: 14px; white-space: nowrap;
    }
    #top-bar .stat { display: flex; gap: 6px; align-items: center; }
    #top-bar .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    #top-bar .stat .value { font-weight: 600; font-variant-numeric: tabular-nums; }
    #cash-value { color: #7fe08a; }
    #integrity-bar {
      width: 90px; height: 8px; border-radius: 4px;
      background: rgba(255,255,255,0.12); overflow: hidden;
    }
    #integrity-fill { height: 100%; width: 100%; background: #7fe08a; transition: width 0.4s, background 0.4s; }

    #wind-panel {
      position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; color: var(--muted);
    }
    #wind-compass { width: 56px; height: 56px; }

    #action-buttons {
      position: absolute; top: max(116px, calc(env(safe-area-inset-top) + 106px)); right: max(10px, env(safe-area-inset-right));
      display: flex; flex-direction: column; gap: 8px;
    }
    .action-btn {
      width: 44px; height: 44px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 19px; line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .action-btn:active { border-color: var(--accent2); }
    .action-btn.active { border-color: var(--accent); box-shadow: 0 0 8px rgba(255,140,58,0.4); }

    #unit-panel {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .unit-card {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 8px;
      padding: 6px 10px;
      min-width: 92px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .unit-card.selected { border-color: var(--accent); box-shadow: 0 0 8px rgba(255,140,58,0.4); }
    .unit-card.all { display: flex; align-items: center; justify-content: center; min-width: 56px; font-weight: 700; }
    .unit-card.all .name { color: var(--accent2); }
    .unit-card .name { font-size: 12px; font-weight: 600; }
    .unit-card .state { font-size: 10px; color: var(--muted); text-transform: lowercase; }
    .unit-card .water-bar {
      margin-top: 4px; height: 5px; border-radius: 3px;
      background: rgba(255,255,255,0.12); overflow: hidden;
    }
    .unit-card .water-fill { height: 100%; background: var(--accent2); transition: width 0.2s; }

    #shop-toggle {
      position: absolute; bottom: 12px; right: 12px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      padding: 10px 16px;
      border: 1px solid var(--hud-border);
    }
    #shop-toggle:hover { border-color: var(--accent); }

    #budget-toggle {
      position: absolute; bottom: 60px; right: 12px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      padding: 9px 12px;
      border: 1px solid var(--hud-border);
      font-variant-numeric: tabular-nums;
    }
    #budget-toggle:hover { border-color: #7fe08a; }
    #budget-panel {
      position: absolute; bottom: 104px; right: 12px;
      width: 320px; max-height: 64vh; overflow-y: auto;
      display: none;
    }
    #budget-panel.open { display: block; }
    #budget-panel h3 { margin: 4px 0 8px; font-size: 14px; }
    #budget-panel h4 { margin: 10px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .b-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
    .b-row.b-head { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; margin-top: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .b-row.b-net { border-top: 1px solid rgba(255,255,255,0.12); margin-top: 2px; }
    .b-row .pos { color: #7fe08a; }
    .b-row .neg { color: #f0a0a0; }
    .budget-options { display: flex; gap: 5px; flex-wrap: wrap; }
    .budget-opt {
      flex: 1 1 45%;
      background: #1d2a3a; color: var(--text);
      border: 1px solid var(--hud-border); border-radius: 6px;
      padding: 6px 8px; font-size: 11px; cursor: pointer;
      text-align: left;
    }
    .budget-opt b { display: block; font-size: 12px; }
    .budget-opt span { color: var(--muted); font-size: 10px; }
    .budget-opt.active { border-color: var(--accent); box-shadow: 0 0 6px rgba(255,140,58,0.35); }
    #shop-panel {
      position: absolute; bottom: 58px; right: 12px;
      width: 300px; max-height: 60vh; overflow-y: auto;
      display: none;
    }
    #shop-panel.open { display: block; }
    #shop-panel h3 { margin: 4px 0 10px; font-size: 14px; }
    .shop-item {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: 7px 0;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .shop-item .info { flex: 1; }
    .shop-item .iname { font-size: 13px; font-weight: 600; }
    .shop-item .idesc { font-size: 11px; color: var(--muted); }
    .shop-item button {
      background: #1d2a3a; color: var(--text);
      border: 1px solid var(--hud-border); border-radius: 6px;
      padding: 5px 10px; font-size: 12px; cursor: pointer;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .shop-item button:hover:not(:disabled) { border-color: #7fe08a; }
    .shop-item button:disabled { opacity: 0.4; cursor: default; }

    #toast-area {
      position: absolute; top: 64px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none;
    }
    .toast {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 6px; padding: 6px 14px;
      font-size: 13px;
      animation: toast-in 0.25s ease-out, toast-out 0.5s ease-in 3.2s forwards;
    }
    .toast.warn { border-color: var(--accent); color: #ffb37e; }
    .toast.good { border-color: #7fe08a; color: #a9f0b1; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
    @keyframes toast-out { to { opacity: 0; } }

    #debug-panel {
      position: absolute; top: 10px; left: 10px;
      font: 11px/1.5 monospace; display: none;
      white-space: pre;
    }
    #debug-panel.open { display: block; }

    #toolbar {
      position: absolute; bottom: 12px; left: 12px;
      display: flex; gap: 6px;
    }
    .tool-btn {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 13px; cursor: pointer;
      position: relative;
    }
    .tool-btn:hover { border-color: var(--accent2); }
    .tool-btn.active { border-color: var(--accent); box-shadow: 0 0 8px rgba(255,140,58,0.4); }
    .tool-btn:disabled { opacity: 0.35; cursor: default; }
    .tool-btn .badge {
      position: absolute; top: -6px; right: -6px;
      background: var(--accent2); color: #08121c;
      font-size: 10px; font-weight: 700;
      border-radius: 8px; padding: 1px 5px;
    }

    #dev-panel {
      position: absolute; top: 228px; right: 10px;
      display: none; flex-direction: column; gap: 6px;
      border-color: #b07fe0;
    }
    #dev-panel.open { display: flex; }
    #dev-panel h4 { margin: 0 0 2px; font-size: 11px; color: #b07fe0; text-transform: uppercase; letter-spacing: 0.08em; }
    #dev-panel button {
      background: #241a30; color: var(--text);
      border: 1px solid rgba(176,127,224,0.4); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    #dev-panel button.active { border-color: #b07fe0; box-shadow: 0 0 8px rgba(176,127,224,0.5); }

    #screen-overlay {
      position: absolute; inset: 0;
      background: rgba(6, 9, 14, 0.88);
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      text-align: center;
    }
    #screen-overlay.open { display: flex; }
    #screen-overlay h1 { font-size: 42px; margin: 0; letter-spacing: 0.04em; }
    #screen-overlay h1 .fire { color: var(--accent); }
    #screen-overlay p { color: var(--muted); max-width: 520px; margin: 0; line-height: 1.6; font-size: 14px; }
    #screen-overlay .big-btn {
      background: var(--accent); color: #1a0e04;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: 700;
      padding: 12px 36px; cursor: pointer;
      margin-top: 8px;
    }
    #screen-overlay .big-btn:hover { filter: brightness(1.1); }
    #screen-stats { font-size: 15px; color: var(--text); }

    /* --- mobile layout --- */
    @media (max-width: 760px), (max-height: 500px) {
      #top-bar {
        top: max(6px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        transform: none;
        gap: 8px 12px; padding: 5px 9px; font-size: 12px;
        max-width: calc(100vw - 128px);
        flex-wrap: wrap; justify-content: flex-start;
      }
      #top-bar .stat .label { font-size: 9px; }
      #integrity-bar { width: 48px; }
      #wind-panel { transform: scale(0.85); transform-origin: top right; }
      #action-buttons { top: max(104px, calc(env(safe-area-inset-top) + 96px)); }
      .action-btn { width: 48px; height: 48px; }
      #unit-panel {
        /* sits above the toolbar/shop row so nothing overlaps */
        bottom: max(64px, calc(env(safe-area-inset-bottom) + 56px));
        max-width: 88vw; overflow-x: auto;
        padding-bottom: 2px;
      }
      .unit-card { min-width: 78px; padding: 5px 7px; }
      .unit-card .name { font-size: 11px; }
      #toolbar {
        bottom: max(8px, env(safe-area-inset-bottom));
        left: max(8px, env(safe-area-inset-left));
        flex-direction: column; gap: 5px;
      }
      .tool-btn { padding: 10px 10px; font-size: 12px; }
      #shop-toggle {
        bottom: max(8px, env(safe-area-inset-bottom));
        right: max(8px, env(safe-area-inset-right));
        padding: 12px 14px;
      }
      #shop-panel {
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: 64px; width: auto; max-height: 46vh;
      }
      #budget-toggle {
        bottom: max(58px, calc(env(safe-area-inset-bottom) + 50px));
        right: max(8px, env(safe-area-inset-right));
        font-size: 11px; padding: 10px 10px;
      }
      #budget-panel {
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: 104px; width: auto; max-height: 46vh;
      }
      /* span the gap between the toolbar (left) and budget/shop buttons (right) */
      #unit-panel { left: 100px; right: 90px; transform: none; max-width: none; justify-content: flex-start; }
      .shop-item button { padding: 9px 12px; }
      #toast-area { top: 52px; width: 92vw; }
      .toast { font-size: 12px; }
      #dev-panel { top: 220px; }
      #screen-overlay h1 { font-size: 30px; }
      #screen-overlay p { max-width: 86vw; font-size: 13px; }
      #debug-panel { font-size: 9px; }
    }

    .alert-arrow {
      position: absolute;
      width: 0; height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 16px solid var(--accent);
      filter: drop-shadow(0 0 5px rgba(255, 100, 30, 0.9));
      pointer-events: none;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.55; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <div id="top-bar" class="panel">
      <div class="stat"><span class="label">Cash</span><span class="value" id="cash-value">$0</span></div>
      <div class="stat"><span class="label">Score</span><span class="value" id="score-value">0</span></div>
      <div class="stat"><span class="label">Wave</span><span class="value" id="wave-value">1</span></div>
      <div class="stat"><span class="label">City</span><div id="integrity-bar"><div id="integrity-fill"></div></div></div>
    </div>
    <div id="wind-panel" class="panel">
      <svg id="wind-compass" viewBox="-32 -32 64 64">
        <circle r="28" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <text y="-19" text-anchor="middle" fill="#9aa7b8" font-size="9">N</text>
        <g id="wind-arrow">
          <path d="M 0 -14 L 6 8 L 0 4 L -6 8 Z" fill="#4db8ff"/>
        </g>
      </svg>
      <span id="wind-strength">calm</span>
    </div>
    <div id="action-buttons">
      <button class="action-btn" id="btn-pause" title="Pause (Space)">⏸</button>
      <button class="action-btn" id="btn-hv" title="Heat vision (H)" style="display:none">🌡</button>
    </div>
    <div id="unit-panel"></div>
    <button id="shop-toggle" class="panel">🛒 Upgrades</button>
    <button id="budget-toggle" class="panel">📋 Month 1</button>
    <div id="budget-panel" class="panel">
      <h3>Monthly Strategy</h3>
      <div id="budget-report"></div>
      <h4>Tax rate</h4>
      <div class="budget-options" id="budget-tax"></div>
      <h4>Funding focus</h4>
      <div class="budget-options" id="budget-focus"></div>
    </div>
    <div id="shop-panel" class="panel">
      <h3>Fire Department Upgrades</h3>
      <div id="shop-items"></div>
    </div>
    <div id="toast-area"></div>
    <div id="toolbar">
      <button class="tool-btn active" id="tool-order" title="Dispatch / select units">🚒 Dispatch</button>
      <button class="tool-btn" id="tool-repair" title="Repair a damaged building (cost scales with damage)">🔧 Repair</button>
      <button class="tool-btn" id="tool-hydrant" title="Place a hydrant near a road" disabled>⛲ Hydrant<span class="badge" id="hydrant-count" style="display:none">0</span></button>
    </div>
    <div id="dev-panel" class="panel">
      <h4>Dev Mode</h4>
      <button id="dev-fire">🔥 Fire brush</button>
      <button id="dev-water">💧 Water brush</button>
      <button id="dev-cash">💰 +$1000</button>
    </div>
    <div id="debug-panel" class="panel"></div>
    <div id="screen-overlay"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
